version: '3.8'

services:
  # ================================
  # EVOLUTION API (Open Source)
  # ================================
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
      - EVOLUTION_DB_PROVIDER=postgres
      - EVOLUTION_DB_HOST=postgres
      - EVOLUTION_DB_PORT=5432
      - EVOLUTION_DB_USER=evolution
      - EVOLUTION_DB_PASSWORD=${DB_PASSWORD}
      - EVOLUTION_DB_NAME=evolution
      - EVOLUTION_REDIS_URI=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # BACKEND (Express.js)
  # ================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ialorichat-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - SERVICE_ACCOUNT_KEY=${SERVICE_ACCOUNT_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
    depends_on:
      - evolution
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # POSTGRESQL (Banco Evolution)
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # REDIS (Cache Evolution)
  # ================================
  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # RABBITMQ (Fila Evolution)
  # ================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: evolution-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # NGINX (Reverse Proxy)
  # ================================
  nginx:
    image: nginx:alpine
    container_name: evolution-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - evolution
    networks:
      - evolution-net

# ================================
# VOLUMES
# ================================

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# ================================
# NETWORKS
# ================================

networks:
  evolution-net:
    driver: bridge
